<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#eef5fb;
    --bg-2:#e4f4ef;
    --card:#ffffff;
    --text:#17314d;
    --muted:#5c7186;
    --line:#dfe9f2;
    --blue:#8b5cf6;
    --teal:#17a79a;
    --orange:#ff944d;
    --shadow: 0 24px 60px -20px rgba(23,49,77,.28);
    --radius: 28px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(60% 50% at 14% 8%, rgba(47,109,246,.14), transparent 60%),
      radial-gradient(55% 45% at 90% 12%, rgba(23,167,154,.16), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:40px 32px 32px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-60px; left:-60px;
    width:160px; height:160px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--blue), var(--teal));
    opacity:.10;
  }
  .photo-wrap{
    width:132px;
    height:132px;
    margin:0 auto 20px;
    border-radius:50%;
    padding:5px;
    background:linear-gradient(135deg, var(--blue), var(--teal));
    position:relative;
  }
  .photo-wrap img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--card);
  }
  .status-dot{
    position:absolute;
    bottom:6px; right:6px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--teal);
    border:3px solid var(--card);
  }
  h1{
    font-family:"Fraunces", serif;
    font-size:26px;
    font-weight:600;
    text-align:center;
    margin:0 0 4px;
    letter-spacing:-.01em;
  }
  .role{
    text-align:center;
    color:var(--blue);
    font-weight:600;
    font-size:14.5px;
    margin:0 0 22px;
  }
  .info-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:18px 18px;
    background:linear-gradient(180deg, #f7fafd, #ffffff);
    border:1px solid var(--line);
    border-radius:18px;
    margin-bottom:20px;
  }
  .info-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    font-size:13.5px;
    line-height:1.45;
  }
  .info-row svg{flex:none; margin-top:2px; color:var(--teal);}
  .info-row span{color:var(--text);}
  .info-row .label{
    display:block;
    color:var(--muted);
    font-size:11.5px;
    margin-bottom:1px;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:26px;
  }
  .chip{
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius:999px;
    background:#eef7f6;
    color:var(--teal);
    border:1px solid #cdeae6;
  }
  .chip.alt{
    background:#eaf1ff;
    color:var(--blue);
    border-color:#d3e2ff;
  }
  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 18px;
    border-radius:14px;
    font-weight:700;
    font-size:14.5px;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{
    background:linear-gradient(120deg, var(--blue), var(--teal));
    color:#fff;
    box-shadow:0 14px 26px -10px rgba(47,109,246,.55);
  }
  .btn-secondary{
    background:#fff;
    color:var(--text);
    border:1.5px solid var(--line);
  }
  .btn svg{flex:none;}
  @media (prefers-reduced-motion: reduce){
    .btn{transition:none;}
  }
</style>
</head>
